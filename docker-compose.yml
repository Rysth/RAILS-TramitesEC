services:
  db:
    image: postgres:17-alpine  # Matches newer pg_dump custom format used by Dokku export
    container_name: tramites_ec_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: rails_user
      POSTGRES_PASSWORD: rails_password
      POSTGRES_DB: tramites_ec_development
    ports:
      - "5433:5432"  # Use 5433 on host to avoid conflict with any local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rails_user -d tramites_ec_development"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tramites_ec_web
    command: >
      /bin/bash -c "
        bundle install &&
        rm -f /rails/tmp/pids/server.pid &&
        echo 'Running database migrations...' &&
        bundle exec rails db:migrate &&
        if [ \"${RUN_SEEDS:-false}\" = \"true\" ]; then
          echo 'Loading seed data...' &&
          bundle exec rails db:seed;
        else
          echo 'Skipping seeds (set RUN_SEEDS=true to enable)';
        fi &&
        echo 'Starting Rails server...' &&
        bundle exec rails server -b 0.0.0.0 -p 3000
      "
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - node_modules:/rails/node_modules
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: "postgresql://rails_user:rails_password@db:5432/tramites_ec_development"
      RUN_SEEDS: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  bundle_cache:
  node_modules: